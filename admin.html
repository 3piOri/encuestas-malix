<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración — El Perro Malix</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --olive: #5A5E2F;
      --olive-dark: #434722;
      --bg: #FAF9F5;
      --card: #FFFFFF;
      --text: #262818;
      --muted: #686B56;
      --border: #E4E2D5;
      --danger: #B42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px 48px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 Arial, sans-serif;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    h1,
    h2 {
      color: var(--olive);
    }

    h1 {
      font-size: 1.5rem;
    }

    h2 {
      font-size: 1.2rem;
    }

    .panel,
    .record {
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(90, 94, 47, 0.08);
      margin-bottom: 14px;
    }

    .login-form {
      display: grid;
      gap: 12px;
      max-width: 440px;
    }

    label {
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 9px;
      background: var(--olive);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .danger {
      background: var(--danger);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .muted,
    .status {
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .record-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    .record-title {
      font-weight: 700;
      color: var(--olive);
    }

    .record-details {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .suggestion {
      border-top: 1px solid var(--border);
      margin-top: 12px;
      padding-top: 12px;
      white-space: pre-wrap;
    }

    .photo {
      display: block;
      max-width: 100%;
      max-height: 360px;
      margin-top: 12px;
      border-radius: 10px;
    }

    .hidden {
      display: none !important;
    }

    /* Contenedor relativo para posicionar el ícono dentro del input */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input[type="password"],
    .password-wrapper input[type="text"] {
      width: 100%;
      padding-right: 45px;
      /* Espacio para que el texto no quede debajo del ícono */
    }

    /* Botón del ícono de ojo */
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password:hover {
      color: var(--olive);
    }
  </style>
</head>

<body>
  <main>
    <h1>Administración de encuestas</h1>
    <p class="muted">Ingresa con la cuenta administrativa de Supabase para consultar registros y fotos.</p>

    <section id="loginPanel" class="panel">
      <h2>Iniciar sesión</h2>
      <form id="loginForm">
        <div class="form-group">
          <label class="field-label" for="adminEmail">Correo electrónico</label>
          <input type="email" id="adminEmail" placeholder="tu-correo@ejemplo.com" required />
        </div>

        <div class="form-group">
          <label class="field-label" for="adminPassword">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="adminPassword" placeholder="••••••••" required />
            <button type="button" class="toggle-password" id="togglePasswordBtn" title="Mostrar contraseña">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="btn-primary">Entrar al panel</button>
      </form>
      <p id="loginStatus" class="status" role="status"></p>
    </section>

    <section id="recordsPanel" class="hidden">
      <div class="panel toolbar">
        <button id="refreshButton" type="button">Actualizar registros</button>
        <button id="signOutButton" type="button">Cerrar sesión</button>
      </div>
      <p id="status" class="status" role="status"></p>
      <div id="recordsList"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://qzqbkutvkkbnzidnsrku.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KJKIfqMVIwSM1IXGnrIZLw_6-3CP6bA";
    const PHOTO_BUCKET = "fotos-encuestas";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const loginPanel = document.getElementById("loginPanel");
    const recordsPanel = document.getElementById("recordsPanel");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("btnLogin");
    const loginStatus = document.getElementById("loginStatus");
    const status = document.getElementById("status");
    const recordsList = document.getElementById("recordsList");

    function showSession(session) {
      loginPanel.classList.toggle("hidden", Boolean(session));
      recordsPanel.classList.toggle("hidden", !session);
    }

    function setStatus(message, isError) {
      status.textContent = message;
      status.classList.toggle("error", Boolean(isError));
    }

    function suggestedReply(record) {
      if (record.tipo_encuesta === "post-paseo") {
        if (record.estrellas >= 4 && record.nps >= 9) {
          return `¡Hola, ${record.humano || ""}! Muchas gracias por compartir cómo estuvo el paseo de ${record.perro || "tu peludo"}. Me da mucho gusto saber que regresó ${(record.estado_regreso || "").toLowerCase()}. ¡Le mando un apapacho! 🐾`;
        }
        return `¡Hola, ${record.humano || ""}! Gracias por contarme cómo estuvo el paseo de ${record.perro || "tu peludo"}. Leí tus comentarios y quiero asegurarme de que cada paseo sea una buena experiencia. Cuando puedas, cuéntame un poco más para revisar qué podemos ajustar. 🐾`;
      }

      if (record.clasificacion_interna === "Externo") {
        return `¡Hola! Muchas gracias por avisarme con confianza. Entiendo perfectamente (${(record.motivo_pausa || "").toLowerCase()}), aquí no hay ningún problema ni compromiso. Cuando todo se acomode y quieran retomar los paseos con ${record.perro || "tu peludo"}, me escribes y con muchísimo gusto agendamos de nuevo. ¡Un abrazo y apapacho para ${record.perro || "tu peludo"}! 🐾🌿`;
      }
      return `¡Hola! Muchas gracias por tomarte el tiempo de avisarme y por tu sinceridad. Para mí lo más importante es que tanto tú como ${record.perro || "tu peludo"} se sientan 100% cómodos y tranquilos con cada paseo. Si en algún momento quieres que ajustemos horario, dinámica o algún detalle, aquí estoy para escucharte sin ningún compromiso. ¡Saludos! 🐾`;
    }

    function recordDetails(record) {
      const entries = record.tipo_encuesta === "post-paseo"
        ? [
          ["Humano", record.humano],
          ["Perro", record.perro],
          ["Calificación", record.estrellas == null ? null : `${record.estrellas}/5`],
          ["Cómo regresó", record.estado_regreso],
          ["Lo que más gustó", record.lo_que_gusto],
          ["Recomendación (NPS)", record.nps == null ? null : `${record.nps}/10`],
          ["Comentario", record.comentario],
          ["Autoriza uso en redes", record.autoriza_redes ? "Sí" : "No"]
        ]
        : [
          ["Perro", record.perro],
          ["Motivo", record.motivo_pausa],
          ["Clasificación", record.clasificacion_interna],
          ["Nota", record.comentario]
        ];
      return entries.map(([label, value]) => `${label}: ${value || "—"}`).join("\n");
    }

    function getPhotoPath(photoUrl) {
      if (!photoUrl) return null;
      const parsed = new URL(photoUrl);
      const projectOrigin = new URL(SUPABASE_URL).origin;
      const prefix = `/storage/v1/object/public/${PHOTO_BUCKET}/`;
      if (parsed.origin !== projectOrigin || !parsed.pathname.startsWith(prefix)) {
        throw new Error("La URL de foto no pertenece al bucket esperado.");
      }
      return decodeURIComponent(parsed.pathname.slice(prefix.length));
    }

    async function deleteRecord(record, button) {
      if (!window.confirm("¿Borrar este registro? Esta acción no se puede deshacer.")) return;
      button.disabled = true;
      setStatus("Borrando registro...", false);

      try {
        const { data, error } = await db
          .from("encuestas_malix")
          .delete()
          .eq("id", record.id)
          .select("id");
        if (error) throw error;
        if (!data || data.length !== 1) {
          throw new Error("Supabase no confirmó el borrado. Verifica los permisos RLS.");
        }

        let photoWarning = "";
        if (record.foto_url) {
          try {
            const photoPath = getPhotoPath(record.foto_url);
            const { error: photoError } = await db.storage.from(PHOTO_BUCKET).remove([photoPath]);
            if (photoError) throw photoError;
          } catch (photoError) {
            console.error("Se borró la encuesta, pero no se pudo borrar su foto.", photoError);
            photoWarning = " La foto quedó en el bucket y debe borrarse manualmente.";
          }
        }

        await loadRecords();
        if (photoWarning) setStatus(`Registro borrado.${photoWarning}`, true);
      } catch (error) {
        console.error("No se pudo borrar el registro de Supabase.", error);
        setStatus("No se pudo borrar el registro. Revisa la sesión y las políticas RLS.", true);
        button.disabled = false;
      }
    }

    function renderRecords(records) {
      recordsList.replaceChildren();
      if (records.length === 0) {
        setStatus("No hay registros disponibles.", false);
        return;
      }

      setStatus(`Se encontraron ${records.length} registro(s).`, false);
      records.forEach(record => {
        const card = document.createElement("article");
        card.className = "record";

        const heading = document.createElement("div");
        heading.className = "record-head";
        const title = document.createElement("span");
        title.className = "record-title";
        title.textContent = record.tipo_encuesta === "post-paseo" ? "Post-Paseo" : "Pausa / Ajuste";
        const date = document.createElement("time");
        date.dateTime = record.created_at || "";
        const parsedDate = new Date(record.created_at);
        date.textContent = Number.isNaN(parsedDate.getTime())
          ? "Fecha desconocida"
          : parsedDate.toLocaleString("es-MX");
        heading.append(title, date);
        card.appendChild(heading);

        const details = document.createElement("p");
        details.className = "record-details";
        details.textContent = recordDetails(record);
        card.appendChild(details);

        if (record.foto_url) {
          const imageLink = document.createElement("a");
          imageLink.href = record.foto_url;
          imageLink.target = "_blank";
          imageLink.rel = "noopener";
          imageLink.textContent = "Abrir foto";
          const image = document.createElement("img");
          image.className = "photo";
          image.src = record.foto_url;
          image.alt = `Foto de ${record.perro || "la encuesta"}`;
          imageLink.appendChild(image);
          card.appendChild(imageLink);
        }

        const suggestion = document.createElement("p");
        suggestion.className = "suggestion";
        suggestion.textContent = `Respuesta sugerida:\n${suggestedReply(record)}`;
        card.appendChild(suggestion);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "danger";
        deleteButton.textContent = "Borrar registro";
        deleteButton.setAttribute("aria-label", `Borrar registro ${record.id}`);
        deleteButton.addEventListener("click", () => deleteRecord(record, deleteButton));
        card.appendChild(deleteButton);
        recordsList.appendChild(card);
      });
    }

    async function loadRecords() {
      setStatus("Cargando registros...", false);
      try {
        const { data, error } = await db
          .from("encuestas_malix")
          .select("id, created_at, tipo_encuesta, humano, perro, estrellas, estado_regreso, lo_que_gusto, nps, comentario, autoriza_redes, foto_url, motivo_pausa, clasificacion_interna")
          .order("created_at", { ascending: false });
        if (error) throw error;
        renderRecords(data || []);
      } catch (error) {
        console.error("No se pudieron cargar las encuestas de Supabase.", error);
        recordsList.replaceChildren();
        setStatus("No se pudieron cargar los registros. Verifica que iniciaste sesión con la cuenta autorizada y que las políticas RLS estén configuradas.", true);
      }
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      loginButton.disabled = true;
      setStatus("", false);
      loginStatus.textContent = "";
      loginStatus.classList.remove("error");
      try {
        const { data, error } = await db.auth.signInWithPassword({
          email: document.getElementById("adminEmail").value.trim(),
          password: document.getElementById("adminPassword").value
        });
        if (error) throw error;
        showSession(data.session);
        document.getElementById("adminPassword").value = "";
        await loadRecords();
      } catch (error) {
        console.error("No se pudo iniciar sesión en Supabase.", error);
        loginStatus.textContent = "No se pudo iniciar sesión. Revisa el correo, la contraseña y la configuración de Supabase Auth.";
        loginStatus.classList.add("error");
      } finally {
        loginButton.disabled = false;
      }
    });

    document.getElementById("refreshButton").addEventListener("click", loadRecords);
    document.getElementById("signOutButton").addEventListener("click", async () => {
      const { error } = await db.auth.signOut();
      if (error) {
        console.error("No se pudo cerrar la sesión de Supabase.", error);
        setStatus("No se pudo cerrar la sesión. Inténtalo de nuevo.", true);
        return;
      }
      showSession(null);
      recordsList.replaceChildren();
    });

    db.auth.getSession().then(({ data, error }) => {
      if (error) {
        console.error("No se pudo comprobar la sesión de Supabase.", error);
        loginStatus.textContent = "No se pudo comprobar la sesión actual.";
        loginStatus.classList.add("error");
        return;
      }
      showSession(data.session);
      if (data.session) loadRecords();
    });

    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    const adminPasswordInput = document.getElementById("adminPassword");
    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = adminPasswordInput.type === "password";
      adminPasswordInput.type = isPassword ? "text" : "password";
      togglePasswordBtn.textContent = isPassword ? "🙈" : "👁️";
      togglePasswordBtn.title = isPassword ? "Ocultar contraseña" : "Mostrar contraseña";
    });
  </script>
</body>

</html>
